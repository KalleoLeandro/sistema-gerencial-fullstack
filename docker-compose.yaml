services:
  mysql:
    build:
      context: ./db
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - minharede
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    build:
      context: ./ndb
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: sistema_gerencial_auditoria
    volumes:
      - mongodb-data:/data/db
    networks:
      - minharede
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://root:root@127.0.0.1:27017/admin", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    build:
      context: ./mensageria
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - minharede
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  back-end:
    build:
      context: ./back-end
    container_name: back-end
    networks:
      - minharede
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sistema_gerencial_fullstack
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATA_MONGODB_URI=mongodb://root:root@mongodb:27017/sistema_gerencial_auditoria?authSource=admin
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest

  bff:
    build:
      context: ./bff
    container_name: bff
    networks:
      - minharede
    ports:
      - "3000:3000"
    depends_on:
      - back-end
    environment:
      - PORT=3000
      - BACK_END=http://back-end:8080

  front-end-angular:
    build:
      context: ./front-end
    container_name: front-end
    networks:
      - minharede
    ports:
      - "4200:80"
    depends_on:
      - bff

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    depends_on:
      - back-end
    ports:
      - "9090:9090"
    networks:
      - minharede
    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
     - "3001:3000"
    environment:
     - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
     - minharede
    volumes:
     - grafana_data:/var/lib/grafana
     - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
     - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
     - ./grafana/dashboards:/var/lib/grafana/dashboards   

  sonarqube:
    image: sonarqube:latest
    container_name: sonar
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    networks:
      - minharede
  
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "127.0.0.1:8085:8080"

    environment:
      TZ: America/Sao_Paulo
    
    networks:
      - minharede

    volumes:
      - jenkins_home:/var/jenkins_home

    profiles:
      - ci
  
  jenkins-agent:
    build:
      context: ./infraestrutura/jenkins-agent
      dockerfile: Dockerfile

    image: sistema-gerencial/jenkins-agent:1.0
    container_name: jenkins-agent
    restart: unless-stopped
    init: true

    networks:
      - minharede

    environment:
      JENKINS_URL: http://jenkins:8080/
      JENKINS_AGENT_NAME: agente-local
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_WEB_SOCKET: "true"

    volumes:
      - jenkins_agent_home:/home/jenkins/agent

    profiles:
      - ci

      
  

networks:
  minharede:
    driver: bridge

volumes:
  mysql-data:
  mongodb-data:
  rabbitmq-data:
  prometheus-data:
  grafana_data:
  sonarqube_data:
  sonar-token:
  jenkins_home:
  jenkins_agent_home:
