sonar.projectKey=bff
sonar.projectName=BFF Node
sonar.projectVersion=1.0

# Fontes de producao
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.testing.ts

# Testes na mesma pasta das classes
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.testing.ts

# Exclusoes somente da cobertura
sonar.coverage.exclusions=**/main.ts,**/app.module.ts,**/*.module.ts,**/*.config.ts,**/environments.ts,**/models/**,**/*.dto.ts,**/*.entity.ts,**/*.interface.ts

# Relatorio de cobertura Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Servidor SonarQube
sonar.host.url=http://sonarqube:9000