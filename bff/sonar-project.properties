sonar.projectKey=bff
sonar.projectName=BFF Node
sonar.projectVersion=1.0

# Codigo TypeScript
sonar.sources=src

# Arquivos de teste
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclusoes da analise
sonar.exclusions=**/main.ts,**/app.module.ts,**/*.module.ts,node_modules/**,**/__tests__/**,**/*.spec.ts,**/*.test.ts,jest.config.ts,src/index.ts,src/configs/**,src/routes/**,**/custom-error.ts,**/environments.ts,**/global-exception-filter.ts,**/metrics.controller.ts,**/token.middleware.ts

# Cobertura Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Servidor SonarQube
sonar.host.url=http://sonarqube:9000