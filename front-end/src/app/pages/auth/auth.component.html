<div class="login-shell" id="container">
  <div class="login-card">
    <section class="login-brand-panel">
      <div class="login-brand-stage">
        <h1 class="login-brand-title">Sistema de Gestao da Informacao</h1>
        <img src="/leal-informatica-stacked.svg" alt="Logo Leal Informatica com textos abaixo" class="login-brand-logo">
      </div>
    </section>

    <section class="login-form-panel">
      <div class="login-form-header">
        <p class="login-form-kicker">Acesso seguro</p>
        <h2>Entrar na plataforma</h2>
      </div>

      <form [formGroup]="AuthForm" (ngSubmit)="entrar()" class="login-form">
        <div>
          <mat-form-field appearance="fill" class="login-field w-full">
            <mat-label>Login</mat-label>
            <input
              matInput
              type="text"
              id="login"
              formControlName="login"
              placeholder="Digite seu login"
              autocomplete="username">
            <mat-error *ngIf="AuthForm.controls['login'].touched && AuthForm.controls['login'].invalid">Informe seu login</mat-error>
          </mat-form-field>
        </div>

        <div>
          <mat-form-field appearance="fill" class="login-field w-full">
            <mat-label>Senha</mat-label>
            <input
              matInput
              [type]="hidePassword ? 'password' : 'text'"
              id="senha"
              formControlName="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password">
            <button type="button" mat-button matSuffix (click)="togglePasswordVisibility()">
              {{ hidePassword ? 'Mostrar' : 'Ocultar' }}
            </button>
            <mat-error *ngIf="AuthForm.controls['senha'].touched && AuthForm.controls['senha'].invalid">Informe sua senha</mat-error>
          </mat-form-field>
        </div>

        <button
          type="submit"
          class="login-button"
          [disabled]="this.AuthForm.invalid">
          Entrar
        </button>
      </form>
    </section>
  </div>
</div>
