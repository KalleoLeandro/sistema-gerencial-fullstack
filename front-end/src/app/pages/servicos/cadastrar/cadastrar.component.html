<app-form-submit-loader [loading]="salvando" [message]="id ? 'Atualizando servico...' : 'Cadastrando servico...'">
  <div class="container-fluid">
    <div class="card page-card">
      <div class="page-header">
        <div>
          <small class="eyebrow">Catalogo</small>
          <h2>{{ id ? 'Editar servico' : 'Novo servico' }}</h2>
        </div>
      </div>

      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Codigo</mat-label>
          <input matInput [(ngModel)]="form.codigo" />
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Nome</mat-label>
          <input matInput [(ngModel)]="form.nome" />
        </mat-form-field>
        <mat-form-field appearance="fill" class="full">
          <mat-label>Descricao</mat-label>
          <textarea matInput [(ngModel)]="form.descricao" rows="4"></textarea>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Valor padrao</mat-label>
          <input matInput [(ngModel)]="form.valor_padrao" type="text" currencyMask [options]="moneyMaskOptions" />
        </mat-form-field>
        <div class="toggle-field">
          <mat-checkbox [(ngModel)]="form.ativo">Servico ativo</mat-checkbox>
        </div>
      </div>

      <div class="actions">
        <button mat-flat-button type="button" class="btn btn-light" (click)="voltar()">Voltar</button>
        <button mat-flat-button type="button" class="btn btn-primary" (click)="salvar()" [disabled]="salvando">Salvar</button>
      </div>
    </div>
  </div>
</app-form-submit-loader>
