<app-form-submit-loader [loading]="salvando" [message]="id ? 'Atualizando usuario...' : 'Cadastrando usuario...'">
  <div class="page-shell">
    <div class="card page-card">
      <div class="card-header py-3 mb-2 page-heading">
        <h2>Cadastro de Usuarios</h2>
      </div>
      <form [formGroup]="cadastroForm" class="usuario-form">
        <input type="hidden" name="id" id="id" formControlName="id">

        <div class="card section-card">
          <div class="card-header py-3 mb-2 section-heading">
            <h3>Dados Pessoais</h3>
          </div>

        <div class="form-grid">
          <app-aero-field class="span-6">
            <span aeroLabel>Nome</span>
            <input aeroControl type="text" formControlName="nome" name="nome">
            <span aeroError *ngIf="cadastroForm.controls['nome'].touched && cadastroForm.controls['nome'].invalid">
              Campo obrigatorio
            </span>
          </app-aero-field>

          <app-aero-field>
            <span aeroLabel>Login</span>
            <input aeroControl type="text" formControlName="login" name="login">
            <span aeroError *ngIf="cadastroForm.controls['login'].touched && cadastroForm.controls['login'].invalid">
              Campo obrigatorio
            </span>
          </app-aero-field>

          <app-aero-field>
            <span aeroLabel>Senha</span>
            <input aeroControl type="password" formControlName="senha" name="senha">
            <span aeroError *ngIf="cadastroForm.controls['senha'].touched && cadastroForm.controls['senha'].invalid">
              Campo obrigatorio
            </span>
          </app-aero-field>

          <app-aero-field class="span-4">
            <span aeroLabel>Perfil</span>
            <select aeroControl formControlName="perfil">
              <option value="">--Selecione o perfil--</option>
              <option *ngFor="let item of perfil" [ngValue]="item">{{ item }}</option>
            </select>
            <span aeroError *ngIf="cadastroForm.controls['perfil'].touched && cadastroForm.controls['perfil'].invalid">
              Campo obrigatorio
            </span>
          </app-aero-field>
        </div>
        </div>

        <div class="form-actions">
          <button type="button" aeroButton="primary"  [disabled]="cadastroForm.invalid"
            (click)="$event.preventDefault(); cadastrarAtualizarUsuario()">
            {{ id ? 'Atualizar' : 'Cadastrar' }}
          </button>
          <button type="button" aeroButton="secondary"  (click)="$event.preventDefault(); limparFormulario()">
            {{ id ? 'Restaurar Campos' : 'Limpar Formulario' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</app-form-submit-loader>
