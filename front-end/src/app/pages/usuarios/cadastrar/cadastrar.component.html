<app-form-submit-loader [loading]="salvando" [message]="id ? 'Atualizando usuario...' : 'Cadastrando usuario...'">
  <div class="page-shell">
    <div class="card page-card">
      <div class="card-header py-3 mb-2 page-heading">
        <h2>Cadastro de Usuarios</h2>
      </div>
      <form [formGroup]="cadastroForm" class="usuario-form">
        <input type="hidden" name="id" id="id" formControlName="id">

        <div class="card section-card">
          <div class="card-header py-3 mb-2 section-heading">
            <h3>Dados Pessoais</h3>
          </div>

        <div class="form-grid">
          <mat-form-field appearance="fill" class="span-6">
            <mat-label>Nome</mat-label>
            <input matInput type="text" formControlName="nome" name="nome">
            <mat-error *ngIf="cadastroForm.controls['nome'].touched && cadastroForm.controls['nome'].invalid">
              Campo obrigatorio
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Login</mat-label>
            <input matInput type="text" formControlName="login" name="login">
            <mat-error *ngIf="cadastroForm.controls['login'].touched && cadastroForm.controls['login'].invalid">
              Campo obrigatorio
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Senha</mat-label>
            <input matInput type="password" formControlName="senha" name="senha">
            <mat-error *ngIf="cadastroForm.controls['senha'].touched && cadastroForm.controls['senha'].invalid">
              Campo obrigatorio
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill" class="span-4">
            <mat-label>Perfil</mat-label>
            <mat-select formControlName="perfil">
              <mat-option value="">--Selecione o perfil--</mat-option>
              <mat-option *ngFor="let item of perfil" [value]="item">{{ item }}</mat-option>
            </mat-select>
            <mat-error *ngIf="cadastroForm.controls['perfil'].touched && cadastroForm.controls['perfil'].invalid">
              Campo obrigatorio
            </mat-error>
          </mat-form-field>
        </div>
        </div>

        <div class="form-actions">
          <button mat-flat-button class="btn btn-primary" [disabled]="cadastroForm.invalid"
            (click)="$event.preventDefault(); cadastrarAtualizarUsuario()">
            {{ id ? 'Atualizar' : 'Cadastrar' }}
          </button>
          <button mat-stroked-button class="btn btn-warning" (click)="$event.preventDefault(); limparFormulario()">
            {{ id ? 'Restaurar Campos' : 'Limpar Formulario' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</app-form-submit-loader>
