<!-- Begin Page Content -->
<div class="container-fluid">
  <div class="card mb-4">
    <div class="card-header py-3 mb-2">
      <h6 class="m-0 font-weight-bold text-secondary">Lista de Usuários</h6>
    </div>
    <div class="col-12">
      <div class="d-flex justify-content-start p-2 gap-2">
        <div class="col-7 from-control">
          <label>Pesquisa</label>
          <input type="search" class="form-control" placeholder="Digite parte do nome do usuário" aria-label="Pesquisar" [(ngModel)]="dadosPesquisa" (input)="verificarVazio()"/>
        </div>
        <div class="col-1 d-flex flex-column justify-content-end">
          <button mat-flat-button type="button" class="btn btn-success" (click)="page = 1">
            Pesquisar
          </button>
        </div>
      </div>

      <div class="d-flex flex-column justify-content-between w-100 p-4 list-pagination-bar">
        <nav aria-label="Paginacao" class="mt-5 list-pagination-nav">
          <small class="text-secondary">
            Exibindo {{ limit }} itens de {{ listaLogins().total }}
          </small>
          <ul class="pagination justify-content-center mt-2">
            <li class="page-item" [class.disabled]="page === 1">
              <button class="page-link text-secondary" (click)="paginaAnterior()">Anterior</button>
            </li>
            <li class="page-item" *ngFor="let pagina of paginasVisiveis" [class.active]="page === pagina">
              <button class="page-link text-secondary" (click)="irParaPagina(pagina)">
                {{ pagina }}
              </button>
            </li>
            <li class="page-item" [class.disabled]="page === totalPages">
              <button class="page-link text-secondary" (click)="proximaPagina()">Próximo</button>
            </li>
          </ul>
        </nav>
      </div>

      <table class="table">
        <thead class="thead-dark">
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">Login</th>
            <th scope="col">Alterar</th>
            <th scope="col">Excluir</th>
          </tr>
        </thead>
        <tbody>
          @for(item of listaLogins().lista; track item){
          <tr>
            <td>{{item.nome}}</td>
            <td>{{item.login}}</td>
            <td>
              <button mat-flat-button type="button" class="btn btn-action-edit btn-icon-action" (click)="alterarLogin(item.id)">
                <i class="fa-solid fa-pen"></i>
              </button>
            </td>
            <td>
              <button mat-flat-button type="button" class="btn btn-action-delete btn-icon-action" (click)="modalExcluirLogin(item.id)">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
          }
        </tbody>
        <button mat-flat-button type="button" class="btn btn-primary mx-1 my-3" (click)="cadastrarNovo()">
          Cadastrar
        </button>
      </table>

      <div class="d-flex flex-column justify-content-between w-100 p-4 list-pagination-bar">
        <select class="form-control" style="height: 50px; width: 265px;" [(ngModel)]="limit" name="limit" (change)="mudarTamanho()">
          <option *ngFor="let item of paginacao; let i = index" [value]="item.numero">{{item.descricao}}</option>
        </select>
        <nav aria-label="Paginacao" class="mt-5 list-pagination-nav">
          <small class="text-secondary">
            Exibindo {{ limit }} itens de {{ listaLogins().total }}
          </small>
          <ul class="pagination justify-content-center mt-2">
            <li class="page-item" [class.disabled]="page === 1">
              <button class="page-link text-secondary" (click)="paginaAnterior()">Anterior</button>
            </li>
            <li class="page-item" *ngFor="let pagina of paginasVisiveis" [class.active]="page === pagina">
              <button class="page-link text-secondary" (click)="irParaPagina(pagina)">
                {{ pagina }}
              </button>
            </li>
            <li class="page-item" [class.disabled]="page === totalPages">
              <button class="page-link text-secondary" (click)="proximaPagina()">Próximo</button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
    <div id="modal">
      <button type="button" id="botaoModal" data-bs-toggle="modal" data-bs-target="#modalConfirmacao"></button>
    </div>
  </div>

</div>

<div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-labelledby="modalConfirmacao" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalConfirmacao">Cadastro de Atendimentos Avulsos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <span>{{resposta}}</span>
      </div>
      <div class="modal-footer">
        <button mat-flat-button *ngIf="excluir" type="button" class="btn btn-action-delete" (click)="excluirLogin()">Excluir</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>
