<!-- Begin Page Content -->
<div class="container-fluid">
  <div class="card mb-4">
    <div class="card-header py-3 mb-2">
      <h6 class="m-0 font-weight-bold text-secondary">Lista de Usuários</h6>
    </div>
    <div class="col-12">
      <div class="d-flex justify-content-start p-2 gap-2">
        <div class="col-7 from-control">
          <label>Pesquisa</label>
          <input type="search" class="form-control" placeholder="Digite parte do nome do usuário" aria-label="Pesquisar" [(ngModel)]="dadosPesquisa" (input)="verificarVazio()"/>
        </div>
        <div class="col-1 d-flex flex-column justify-content-end">
          <button aeroButton="success" type="button"  (click)="page = 1">
            Pesquisar
          </button>
        </div>
      </div>

      <div class="d-flex flex-column justify-content-between w-100 p-4 list-pagination-bar">
        <nav aria-label="Paginacao" class="mt-5 list-pagination-nav">
          <small class="text-secondary">
            Exibindo {{ limit }} itens de {{ listaLogins().total }}
          </small>
          <ul class="pagination justify-content-center mt-2">
            <li class="page-item" [class.disabled]="page === 1">
              <button type="button" aeroButton="secondary"  (click)="paginaAnterior()" [disabled]="page <= 1">Anterior</button>
            </li>
            <li class="page-item" *ngFor="let pagina of paginasVisiveis" [class.active]="page === pagina">
              <button type="button" [aeroButton]="page === pagina ? 'primary' : 'secondary'"  (click)="irParaPagina(pagina)" [attr.aria-current]="page === pagina ? 'page' : null">
                {{ pagina }}
              </button>
            </li>
            <li class="page-item" [class.disabled]="page === totalPages">
              <button type="button" aeroButton="secondary"  (click)="proximaPagina()" [disabled]="page >= totalPages">Próximo</button>
            </li>
          </ul>
        </nav>
      </div>

      <table class="table">
        <thead class="thead-dark">
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">Login</th>
            <th scope="col">Alterar</th>
            <th scope="col">Excluir</th>
          </tr>
        </thead>
        <tbody>
          @for(item of listaLogins().lista; track item){
          <tr>
            <td>{{item.nome}}</td>
            <td>{{item.login}}</td>
            <td>
              <button aeroButton="primary" type="button" class="aero-button--icon" (click)="alterarLogin(item.id)" aria-label="Editar usuário">
                <i class="fa-solid fa-pen"></i>
              </button>
            </td>
            <td>
              <button aeroButton="danger" type="button" class="aero-button--icon" (click)="modalExcluirLogin(item.id)" aria-label="Excluir usuário">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
          }
        </tbody>
        <button aeroButton="primary" type="button" class="mx-1 my-3" (click)="cadastrarNovo()">
          Cadastrar
        </button>
      </table>

      <div class="d-flex flex-column justify-content-between w-100 p-4 list-pagination-bar">
        <app-aero-select class="limit-field" label="Quantidade por página"
          [options]="pageSizeOptions" [ngModel]="limit" name="limit" required
          (ngModelChange)="limit = $event; mudarTamanho()" />
        <nav aria-label="Paginacao" class="mt-5 list-pagination-nav">
          <small class="text-secondary">
            Exibindo {{ limit }} itens de {{ listaLogins().total }}
          </small>
          <ul class="pagination justify-content-center mt-2">
            <li class="page-item" [class.disabled]="page === 1">
              <button type="button" aeroButton="secondary"  (click)="paginaAnterior()" [disabled]="page <= 1">Anterior</button>
            </li>
            <li class="page-item" *ngFor="let pagina of paginasVisiveis" [class.active]="page === pagina">
              <button type="button" [aeroButton]="page === pagina ? 'primary' : 'secondary'"  (click)="irParaPagina(pagina)" [attr.aria-current]="page === pagina ? 'page' : null">
                {{ pagina }}
              </button>
            </li>
            <li class="page-item" [class.disabled]="page === totalPages">
              <button type="button" aeroButton="secondary"  (click)="proximaPagina()" [disabled]="page >= totalPages">Próximo</button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
    <div id="modal">
      <button type="button" id="botaoModal" data-bs-toggle="modal" data-bs-target="#modalConfirmacao"></button>
    </div>
  </div>

</div>

<div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-labelledby="modalConfirmacao" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalConfirmacao">Cadastro de Atendimentos Avulsos</h5>
        <button aeroButton="quiet" type="button"  data-bs-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
      </div>
      <div class="modal-body">
        <span>{{resposta}}</span>
      </div>
      <div class="modal-footer">
        <button aeroButton="danger" *ngIf="excluir" type="button"  (click)="excluirLogin()">Excluir</button>
        <button aeroButton="secondary" type="button"  data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>
