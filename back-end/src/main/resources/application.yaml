server:
  port: 8080
  address: 0.0.0.0
  servlet:
     context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: sistema-gerencial-fullstack
  datasource:
    url: jdbc:mysql://localhost:3306/sistema_gerencial_fullstack
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  file:
    name: logs/application.log
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.connections.pooling: WARN
    org.hibernate: WARN 
    org.springframework.jdbc.datasource: WARN   

secret:
  jwt:
    secret: ${JWT_SECRET:sistema_gerencial_fullstack}

jwt:
  token:
    validity: 3600000
  refresh-token:
    validity: 28800000
  cookie:
    secure: false
    same-site: Lax

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.*.*.*:*,http://192.168.*.*:*,http://172.16.*.*:*,http://172.17.*.*:*,http://172.18.*.*:*,http://172.19.*.*:*,http://172.20.*.*:*,http://172.21.*.*:*,http://172.22.*.*:*,http://172.23.*.*:*,http://172.24.*.*:*,http://172.25.*.*:*,http://172.26.*.*:*,http://172.27.*.*:*,http://172.28.*.*:*,http://172.29.*.*:*,http://172.30.*.*:*,http://172.31.*.*:*,https://localhost:*,https://127.0.0.1:*,https://10.*.*.*:*,https://192.168.*.*:*,https://172.16.*.*:*,https://172.17.*.*:*,https://172.18.*.*:*,https://172.19.*.*:*,https://172.20.*.*:*,https://172.21.*.*:*,https://172.22.*.*:*,https://172.23.*.*:*,https://172.24.*.*:*,https://172.25.*.*:*,https://172.26.*.*:*,https://172.27.*.*:*,https://172.28.*.*:*,https://172.29.*.*:*,https://172.30.*.*:*,https://172.31.*.*:*}

management:
  endpoints:
    web:
      exposure:
        include: "health, metrics, prometheus"
  endpoint:
    health:
      show-details: always
  prometheus:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
